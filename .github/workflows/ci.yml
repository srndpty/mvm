# mvm CI
#
# Phase 0 の CI。Windows + MSYS2 UCRT64 でビルドしてテストする。
#
# 注意: 開発機の凍結パッケージ (third_party/pkgs) は git 管理外なので、
# CI は MSYS2 の最新パッケージを取得する。したがって CI の緑は
# 「最新の依存でも動く」ことしか示さず、docs/deps-lock.txt の構成を
# 再現したことにはならない。再現性の検証は scripts/verify-frozen-restore.ps1
# の役割であり、開発機で行う。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 通常テストの大半 (約 1070 件) は契約・checker スクリプトの検査で、
  # release / debug で結果が変わらない (scripts/test.ps1 の -Group を参照)。
  # 1 job で release と debug を順に回すと約 50 分かかるため、
  #   - release / debug: ビルドしてビルド種別依存のテストだけを実行
  #   - scripts k/n    : configure だけ行い、非依存テストを n 分割して実行
  # に分けて並列に走らせる。
  build-and-test:
    name: build-and-test (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      # 1 つの失敗で他を止めると、どこが壊れたかが分からなくなる。
      fail-fast: false
      matrix:
        include:
          - { name: release,     preset: ucrt64-release, group: BuildDependent,   lint: true }
          - { name: debug,       preset: ucrt64-debug,   group: BuildDependent }
          - { name: scripts 1/3, preset: ucrt64-release, group: BuildIndependent, shard: 1/3 }
          - { name: scripts 2/3, preset: ucrt64-release, group: BuildIndependent, shard: 2/3 }
          - { name: scripts 3/3, preset: ucrt64-release, group: BuildIndependent, shard: 3/3 }
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: MSYS2 UCRT64 を用意
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-shadertools
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-mlt
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-frei0r-plugins
            mingw-w64-ucrt-x86_64-libebur128
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-libsamplerate
            mingw-w64-ucrt-x86_64-rubberband
            mingw-w64-ucrt-x86_64-sox
            mingw-w64-ucrt-x86_64-rtaudio
            mingw-w64-ucrt-x86_64-rnnoise
            mingw-w64-ucrt-x86_64-gtest
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-ccache

      - name: MLT ランタイムの健全性を確認
        run: |
          # モジュールが dlopen できない状態だと、後段が
          # 「filter が見つからない」という分かりにくい形で失敗する。
          # 先にここで落とす。
          ls -la /ucrt64/lib/mlt/ | head -30
          pkgconf --modversion mlt-framework-7

      - name: 整形とアーキテクチャ検査
        if: matrix.lint
        shell: pwsh
        run: |
          $analyzerVersion = (Get-Content scripts/PSScriptAnalyzer.version -Raw).Trim()
          Install-Module PSScriptAnalyzer -RequiredVersion $analyzerVersion -Scope CurrentUser -Force
          pwsh scripts/lint.ps1 -Ucrt64 '${{ steps.msys2.outputs.msys2-location }}\ucrt64'

      # 非依存テストは素材を参照しないので、scripts job では生成しない。
      - name: 検証素材を生成 (Smoke)
        if: matrix.group == 'BuildDependent'
        shell: pwsh
        run: pwsh scripts/make-testmedia.ps1 -Mode Smoke -Ucrt64 '${{ steps.msys2.outputs.msys2-location }}\ucrt64'

      # ビルドする job だけ ccache を使う。テストが失敗してもキャッシュは保存したいので、
      # actions/cache ではなく restore / save を分けて使う。
      - name: ccache を復元
        if: matrix.group == 'BuildDependent'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-

      - name: ビルドとテスト
        shell: pwsh
        # GitHub hosted runner には Meiryo と D3D11VA hardware device が無い。
        # portable suite の件数と結果を検査し、workstation test は開発機で実行する。
        run: |
          $ucrt64 = '${{ steps.msys2.outputs.msys2-location }}\ucrt64'
          if ('${{ matrix.group }}' -eq 'BuildDependent') {
            # CMake は初回 configure 時にこの環境変数を compiler launcher として読む。
            $env:CMAKE_C_COMPILER_LAUNCHER = "$ucrt64\bin\ccache.exe"
            $env:CMAKE_CXX_COMPILER_LAUNCHER = "$ucrt64\bin\ccache.exe"
            $env:CCACHE_DIR = '${{ runner.temp }}\ccache'
            # setup-msys2 は毎回 gcc を入れ直すため、既定の mtime 比較では常に外れる。
            $env:CCACHE_COMPILERCHECK = 'content'
            $env:CCACHE_MAXSIZE = '1G'
            & "$ucrt64\bin\ccache.exe" --zero-stats | Out-Null
          }
          $testArgs = @('-Preset', '${{ matrix.preset }}', '-Group', '${{ matrix.group }}')
          if ('${{ matrix.shard }}') { $testArgs += @('-Shard', '${{ matrix.shard }}') }
          pwsh scripts/test.ps1 -Portable @testArgs -Ucrt64 $ucrt64

      # ヒット率を毎回ログに残す。0% が続くならキャッシュが効いていない。
      - name: ccache の統計
        if: always() && matrix.group == 'BuildDependent'
        shell: pwsh
        run: |
          $env:CCACHE_DIR = '${{ runner.temp }}\ccache'
          & '${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin\ccache.exe' --show-stats

      - name: ccache を保存
        if: always() && matrix.group == 'BuildDependent'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}

      - name: 失敗時の診断情報
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem build -Recurse -Filter '*.log' -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "--- $($_.FullName) ---"; Get-Content $_.FullName -Tail 50 }
